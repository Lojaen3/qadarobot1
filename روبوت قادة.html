<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اصطاد الأفكار</title>
<style>
:root{--card:#ffffffee;--ink:#2f3d5c;--teal:#0e8fae;--purple:#8b5cf6;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1d2540ee;--ink:#eaf3ff;--teal:#5fd8f2}}
:root[data-theme="dark"]{--card:#1d2540ee;--ink:#eaf3ff;--teal:#5fd8f2}
html,body{height:100%;margin:0;overflow:hidden;background:#cfeffa;font-family:Tahoma,Arial,system-ui,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:relative;width:100%;height:100%}
canvas{display:block;width:100%;height:100%}
.hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none;color:#14213d;font-weight:bold;font-size:clamp(18px,3.2vw,30px);text-shadow:0 2px 0 #fff}
#bar{position:absolute;top:calc(env(safe-area-inset-top,0px) + 56px);left:50%;transform:translateX(-50%);width:min(60vw,360px);height:16px;border-radius:9px;background:#ffffffaa;border:2px solid #b9a6f2;overflow:hidden;pointer-events:none}
#fill{height:100%;width:0;background:linear-gradient(90deg,#22d3ee,#8b5cf6);transition:width .2s}
#msg{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:clamp(26px,6vw,56px);font-weight:bold;color:#8b5cf6;text-shadow:0 2px 0 #fff;pointer-events:none;opacity:0;transition:opacity .3s}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#ffffff55}
.card{background:var(--card);color:var(--ink);border:2px solid #b9a6f2;border-radius:28px;padding:28px 34px;text-align:center;max-width:min(88vw,520px);box-shadow:0 10px 30px #7c6bd633}
.card h1{margin:0 0 8px;font-size:clamp(30px,7vw,52px);color:var(--teal)}
.card p{margin:6px 0;font-size:clamp(16px,3.4vw,22px);line-height:1.7}
button{margin-top:14px;font:inherit;font-size:clamp(20px,4vw,28px);font-weight:bold;color:#fff;background:linear-gradient(135deg,#22b8d9,#8b5cf6);border:0;border-radius:40px;padding:12px 42px;cursor:pointer;box-shadow:0 6px 0 #5b3fc4}
#logo{position:absolute;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);width:clamp(110px,20vw,190px);pointer-events:none;z-index:5;display:block}
button:active{transform:translateY(4px);box-shadow:0 2px 0 #5b3fc4}
.hide{display:none}
</style>
</head>

<div class="ov" id="start"><div class="card"><h1>اصطاد الأفكار 💡</h1><p>حرّك الروبوت بإصبعك أو بالماوس أو بالأسهم</p><p>اجمع اللمبات 💡 وتجنب الحشرات 🐛</p><p>املأ الشريط عشان ينطلق الصاروخ 🚀</p><button id="go">ابدأ</button></div></div>
<div class="ov hide" id="over"><div class="card"><h1>انتهت اللعبة</h1><p id="final"></p><p id="best"></p><button id="again">العب مرة ثانية</button></div></div>
</div>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var W,H,dpr;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
window.addEventListener('resize',resize);resize();
var $=function(i){return document.getElementById(i)};
var state='menu',score=0,lives=3,charge=0,boost=0,t=0,speed=1,items=[],parts=[],stars=[],ty=0,ry=0,shake=0,hurt=0;
var best=0;try{best=+localStorage.getItem('qada_best')||0}catch(e){}
for(var i=0;i<14;i++)stars.push({x:Math.random(),y:Math.random(),s:.4+Math.random()*1.2,r:10+Math.random()*26});
var ac=null;
function beep(f,d,ty2,v){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain();o.type=ty2||'sine';o.frequency.value=f;g.gain.value=v||.08;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function say(m){var e=$('msg');e.textContent=m;e.style.opacity=1;clearTimeout(say.h);say.h=setTimeout(function(){e.style.opacity=0},900)}
function reset(){score=0;lives=3;charge=0;boost=0;t=0;speed=1;items=[];parts=[];ty=H/2;ry=H/2;hud()}
function hud(){$('score').textContent='النقاط: '+score;var h='';for(var i=0;i<3;i++)h+=i<lives?'♥':'♡';$('hearts').textContent=h;$('hearts').style.color='#e11d48';$('fill').style.width=(boost>0?100:charge/5*100)+'%'}
function start(){reset();state='play';$('start').classList.add('hide');$('over').classList.add('hide');beep(520,.15);beep(780,.2)}
$('go').onclick=start;$('again').onclick=start;
function setY(y){ty=Math.max(60,Math.min(H-60,y))}
cv.addEventListener('pointermove',function(e){setY(e.clientY-cv.getBoundingClientRect().top)});
cv.addEventListener('pointerdown',function(e){setY(e.clientY-cv.getBoundingClientRect().top)});
var keys={};
window.addEventListener('keydown',function(e){keys[e.key]=1;if(e.key==='Enter'&&state!=='play')start()});
window.addEventListener('keyup',function(e){keys[e.key]=0});
function spawn(){
  var r=Math.random(),y=70+Math.random()*(H-140),type=r<.62?'bulb':(r<.9?'bug':'star');
  items.push({type:type,x:W+60,y:y,ph:Math.random()*6,v:(type==='bug'?1.15:1)*(0.9+Math.random()*.3)});
}
function burst(x,y,c,n){for(var i=0;i<n;i++)parts.push({x:x,y:y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,l:1,c:c})}
function rx(){return Math.max(70,W*.18)}
function update(){
  t++;
  if(keys.ArrowUp||keys.w)ty-=9;if(keys.ArrowDown||keys.s)ty+=9;setY(ty);
  ry+=(ty-ry)*.18;
  speed=1+Math.min(score/60,1.4);
  var gap=Math.max(26,56-score*.4);
  if(t%Math.round(gap)===0)spawn();
  var X=rx(),R=34;
  for(var i=items.length-1;i>=0;i--){
    var it=items[i];it.x-=(4.2+speed*2.6)*it.v*(W<600?.8:1);it.ph+=.1;var y=it.y+Math.sin(it.ph)*10;
    var dx=it.x-X,dy=y-ry,hit=Math.abs(dx)<R+22&&Math.abs(dy)<R+18;
    if(hit){
      if(it.type==='bulb'){score+=boost>0?2:1;if(boost<=0){charge++;if(charge>=5){boost=360;charge=0;say('🚀 انطلق الصاروخ!');beep(300,.4,'sawtooth',.06);beep(900,.4)}}burst(it.x,y,'#ffd400',10);beep(740,.1)}
      else if(it.type==='star'){score+=5;burst(it.x,y,'#c4a6ff',14);beep(980,.18,'triangle');say('نجمة! +5')}
      else{if(boost>0){score+=3;burst(it.x,y,'#4fe3f5',14);beep(660,.1,'square',.05);say('Bug!')}else{lives--;hurt=30;shake=14;burst(it.x,y,'#e11d48',16);beep(150,.3,'sawtooth',.09);say('Bug! 🐛')}}
      items.splice(i,1);hud();
      if(lives<=0){end();return}
    }else if(it.x<-80){items.splice(i,1)}
  }
  if(boost>0){boost--;if(boost===0)hud();}
  for(i=parts.length-1;i>=0;i--){var p=parts[i];p.x+=p.vx;p.y+=p.vy;p.l-=.03;if(p.l<=0)parts.splice(i,1)}
  if(hurt>0)hurt--;if(shake>0)shake--;
  $('score').textContent='النقاط: '+score;$('fill').style.width=(boost>0?boost/360*100:charge/5*100)+'%';
}
function end(){
  state='over';if(score>best){best=score;try{localStorage.setItem('qada_best',best)}catch(e){}}
  $('final').textContent='نقاطك: '+score;$('best').textContent='أفضل نتيجة: '+best;$('over').classList.remove('hide');beep(220,.4,'triangle');
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawRobot(x,y){
  ctx.save();ctx.translate(x,y);
  var bob=Math.sin(t*.12)*3;ctx.translate(0,bob);
  if(hurt>0&&Math.floor(hurt/3)%2)ctx.globalAlpha=.4;
  if(boost>0){ // rocket flame + glow
    ctx.fillStyle='rgba(255,170,60,.9)';ctx.beginPath();ctx.moveTo(-34,8);ctx.lineTo(-90-Math.random()*30,20);ctx.lineTo(-34,32);ctx.fill();
    ctx.fillStyle='rgba(255,240,150,.9)';ctx.beginPath();ctx.moveTo(-34,14);ctx.lineTo(-62-Math.random()*16,20);ctx.lineTo(-34,26);ctx.fill();
    ctx.shadowColor='#22d3ee';ctx.shadowBlur=30;
  }
  // body
  ctx.fillStyle='#ffffff';rr(-24,16,48,40,18);ctx.fill();
  ctx.fillStyle='#32bcd9';ctx.beginPath();ctx.arc(0,36,9,0,7);ctx.fill();
  ctx.fillStyle='#bff6ff';ctx.beginPath();ctx.arc(0,36,5,0,7);ctx.fill();
  // arms
  ctx.fillStyle='#00a8d0';rr(-36,22,14,24,7);ctx.fill();rr(22,22,14,24,7);ctx.fill();
  // head
  ctx.shadowBlur=0;ctx.fillStyle='#ffffff';rr(-40,-40,80,62,26);ctx.fill();
  ctx.fillStyle='#8b5cf6';rr(-45,-22,10,24,5);ctx.fill();rr(35,-22,10,24,5);ctx.fill();
  ctx.fillStyle='#17142b';rr(-32,-32,64,44,18);ctx.fill();
  ctx.strokeStyle='#8b5cf6';ctx.lineWidth=3;rr(-32,-32,64,44,18);ctx.stroke();
  // eyes + smile
  ctx.strokeStyle='#59e6ff';ctx.lineWidth=4;ctx.lineCap='round';
  var bl=(t%160>152)?1:6;
  ctx.beginPath();ctx.ellipse(-12,-12,4,bl,0,0,7);ctx.stroke();ctx.beginPath();ctx.ellipse(12,-12,4,bl,0,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(0,-4,8,.2,2.9);ctx.stroke();
  // graduation cap
  ctx.fillStyle='#8b5cf6';ctx.beginPath();ctx.moveTo(-34,-40);ctx.lineTo(4,-56);ctx.lineTo(42,-40);ctx.lineTo(4,-30);ctx.fill();
  ctx.fillStyle='#32bcd9';rr(-18,-44,44,10,4);ctx.fill();
  ctx.restore();
}
function drawItem(it){
  var y=it.y+Math.sin(it.ph)*10;ctx.save();ctx.translate(it.x,y);
  if(it.type==='bulb'){
    ctx.strokeStyle='#1b2a4a';ctx.lineWidth=3;
    ctx.fillStyle='#5b6b8c';rr(-9,14,18,12,4);ctx.fill();ctx.stroke();
    ctx.fillStyle='#ffd400';ctx.beginPath();ctx.arc(0,-4,20,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-10,5,0,7);ctx.fill();
  }else if(it.type==='star'){
    ctx.fillStyle='#8b3dff';ctx.beginPath();
    for(var i=0;i<10;i++){var a=-Math.PI/2+i*Math.PI/5,r=i%2?11:25;ctx.lineTo(Math.cos(a+it.ph*.3)*r,Math.sin(a+it.ph*.3)*r)}ctx.closePath();ctx.fill();ctx.strokeStyle='#1b2a4a';ctx.lineWidth=3;ctx.lineJoin='round';ctx.stroke();
  }else{
    ctx.strokeStyle='#1b2a4a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,-20);ctx.lineTo(-14,-34);ctx.moveTo(8,-20);ctx.lineTo(14,-34);ctx.stroke();
    ctx.fillStyle='#ff4d6d';rr(-26,-22,52,40,16);ctx.fill();ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-9,-6,7,0,7);ctx.arc(9,-6,7,0,7);ctx.fill();
    ctx.fillStyle='#1b2a4a';ctx.beginPath();ctx.arc(-9,-6,3.5,0,7);ctx.arc(9,-6,3.5,0,7);ctx.fill();
    ctx.beginPath();ctx.arc(0,8,6,3.4,6);ctx.stroke();
  }
  ctx.restore();
}
function draw(){
  var g=ctx.createLinearGradient(0,0,W,H);g.addColorStop(0,'#8fe3f5');g.addColorStop(1,'#c3a9f7');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  for(var i=0;i<stars.length;i++){var s=stars[i],sp=(state==='play'?(1+speed+(boost>0?3:0)):.4)*s.s;s.x-=sp*.0016;if(s.x<-.1){s.x=1.1;s.y=Math.random()}
    ctx.fillStyle=i%2?'rgba(255,255,255,.38)':'rgba(255,255,255,.22)';rr(s.x*W,s.y*H,s.r*1.3,s.r*1.3,6);ctx.fill()}
  if(state==='play'||state==='over'){items.forEach(drawItem)}
  parts.forEach(function(p){ctx.globalAlpha=Math.max(p.l,0);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,5*p.l+1,0,7);ctx.fill();ctx.globalAlpha=1});
  drawRobot(rx(),state==='menu'?H/2+Math.sin(t*.05)*20:ry);
  ctx.restore();
}
function loop(){if(state==='play')update();else t++;draw();requestAnimationFrame(loop)}
ty=ry=H/2;loop();
})();
</script>
